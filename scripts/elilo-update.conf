# /etc/elilo/update.conf — configuration for update-elilo
#
# update-elilo reads this file when called by the kernel hooks (Debian
# family: /etc/kernel/postinst.d, postrm.d; Arch family: pacman hook) or
# when run manually. install-elilo.sh fills in the detected values; they
# stay correct across future kernel upgrades.
#
# After editing, run:  sudo update-elilo

# ── This OS ──────────────────────────────────────────────────────────────────

# Short name for this OS. Its kernels go in ELILO_DIR/<OS_ID>/ and its menu
# entries are labelled <OS_ID>, <OS_ID>-old, ... Letters, digits, . _ - only.
# Leave empty for the single-OS layout of elilo 3.17.x.
OS_ID=

# Name shown in the boot menu.
OS_NAME=

# How this distribution names its kernels:
#   debian  /boot/vmlinuz-<version> + /boot/initrd.img-<version>
#           (Debian, Devuan, Ubuntu, Mint, MX, antiX, ...)
#   arch    /boot/vmlinuz-<pkgbase> + /boot/initramfs-<pkgbase>.img
#           (Arch, Artix, CachyOS, EndeavourOS, Manjaro, ...)
LAYOUT=

# ── ESP ──────────────────────────────────────────────────────────────────────

# Directory on the ESP where elilo.efi and elilo.conf live. Several OSes can
# share it: each one writes its own kernels and menu entries there.
ELILO_DIR=/boot/efi/EFI/elilo

# Order of this OS's entries in the menu (lower first). The first OS to
# install elilo gets 10, the next 20, ...
ENTRY_ORDER=10

# Set to 1 on the one OS that owns the global menu settings below
# (TIMEOUT, PROMPT, DEFAULT). OSes added later leave them alone.
GLOBAL_OWNER=1

# ── Kernel command line ──────────────────────────────────────────────────────

# Root filesystem for root=. UUID=... survives disks being renumbered.
# Run: findmnt -n -o UUID /   (or SOURCE) to see yours.
ROOT_DEV=

# Extra kernel parameters for every entry of this OS. install-elilo.sh copies
# them from the running kernel's command line. For a btrfs root on a
# subvolume, rootflags=subvol=... is added automatically when missing.
# Do NOT add "nomodeset" here unless you have a specific reason — it disables
# KMS and locks you to the firmware's default (often 1024x768) resolution.
APPEND="ro quiet"

# ── Kernels ──────────────────────────────────────────────────────────────────

# debian layout: 1 keeps the previous kernel as a fallback "<OS_ID>-old" entry.
KEEP_PREVIOUS=1

# arch layout: pkgbase of the kernel that gets the plain <OS_ID> label
# (e.g. linux, linux-lts, linux-zen). Empty = "linux", else the first one.
DEFAULT_KERNEL=

# arch layout: "auto" prepends /boot/*-ucode.img (CPU microcode) to each
# initramfs, as elilo loads a single initrd. "none" to disable.
UCODE=auto

# arch layout: 1 adds an entry for each initramfs-<pkgbase>-fallback.img.
INCLUDE_FALLBACK=0

# ── Global menu settings (used only when GLOBAL_OWNER=1) ────────────────────

# Boot menu timeout in tenths of a second (50 = 5 seconds).
TIMEOUT=50

# Set to 1 to show the boot menu, 0 to boot the default without it
# (pressing a key during the TIMEOUT still opens the menu).
PROMPT=1

# Label booted when the timeout expires. Empty = this OS (OS_ID).
DEFAULT=
